apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: default
spec:
  project: default
  source:
    repoURL: https://github.com/arslankhanali/GitOps-App-of-Apps-Pattern
    targetRevision: HEAD
    path: env/k3s # <-- Updated path
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
